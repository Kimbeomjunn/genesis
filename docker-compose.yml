services:
  mysql:
    image: mysql:8
    container_name: genesis-mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: genesis_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-ppassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./genesis_be
    container_name: genesis-backend
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/genesis_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: password

  frontend:
    build: ./genesis_fe
    container_name: genesis-frontend
    ports:
      - "8081:80"

volumes:
  mysql_data: